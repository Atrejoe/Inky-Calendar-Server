name: Build Docker image

on:
  # Nightly build - pull base image
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-docker:
    uses: ./.github/workflows/build-docker-image-reusable.yml
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      docker_image_name: ${{ needs.build-docker.outputs.docker_image_name }}