name: Build Docker image

on:
  # Nightly build - pull base image
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  
  # Or when code has been pushed
  push:
    branches:
      - '**'

jobs:
  build-docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_NAME }}

    - name: Build Docker image
      # You may pin to the exact commit or the version.
      uses: docker/build-push-action@v7
      with:
        # context: .
        sbom: true
        push: false
        tags: atreyu/inkycal.server:latest

    - name: Load Docker image for smoke test
      # Reuses the layers of the previous build; loaded separately because SBOM attestations can't be loaded into the local image store
      uses: docker/build-push-action@v7
      with:
        load: true
        push: false
        tags: inkycal.server:smoke-test

    - name: Checkout (for smoke test compose file)
      uses: actions/checkout@v7

    - name: Smoke test - container starts and reports healthy
      id: smoke-test
      run: docker compose -f smoke-test/compose.yml up --wait --wait-timeout 180

    - name: Smoke test - explain failure
      if: failure() && steps.smoke-test.outcome == 'failure'
      run: |
        compose="docker compose -f smoke-test/compose.yml"
        $compose ps --all
        $compose logs app

        last_health_check=$(docker inspect --format '{{json .State.Health.Log}}' "$($compose ps --all -q app)" | jq -r '.[-1].Output // "none"' | tr '\n' ' ')
        first_error=$($compose logs --no-log-prefix app | grep -m1 -E 'Unhandled exception|fail:|crit:')
        echo "::error title=Smoke test failed::The container did not become healthy.%0ALast health check: ${last_health_check}%0AFirst error in log: ${first_error:-none}"

