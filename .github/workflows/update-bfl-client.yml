name: Update Black Forest Labs API client

# Black Forest Labs offers no .NET SDK. Its client (InkyCal.Utils/BlackForestLabs/Client) is generated by Kiota
# from BFL's OpenAPI spec. This workflow downloads the latest spec, regenerates the client, builds and tests it,
# and opens (or updates) a pull request when anything changed.
# The Kiota version itself (.config/dotnet-tools.json) is kept up to date by Renovate/Dependabot.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Weekly, Monday morning

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x

    - name: Restore tools (Kiota)
      run: dotnet tool restore

    - name: Download OpenAPI spec
      run: |
        curl --fail --silent --show-error --location https://api.bfl.ai/openapi.json --output openapi.tmp.json
        # Pretty print (stable diffs) and validate it is JSON
        python3 -m json.tool --indent 2 openapi.tmp.json > InkyCal.Utils/BlackForestLabs/openapi.json
        rm openapi.tmp.json

    - name: Regenerate client
      # Uses the settings (included paths, namespace, ...) recorded in kiota-lock.json
      run: |
        dotnet kiota update --output InkyCal.Utils/BlackForestLabs/Client
        rm -f InkyCal.Utils/BlackForestLabs/Client/.kiota.log

    - name: Build and test the client
      run: |
        dotnet build InkyCal.Utils.Tests
        dotnet test InkyCal.Utils.Tests --no-build --filter "FullyQualifiedName~BlackForestLabs"

    - name: Create pull request
      uses: peter-evans/create-pull-request@v7
      with:
        branch: automation/update-bfl-client
        commit-message: Update Black Forest Labs API client from OpenAPI spec
        title: Update Black Forest Labs API client
        body: |
          The Black Forest Labs OpenAPI spec (https://api.bfl.ai/openapi.json) changed, the Kiota-generated client was regenerated.
          Build and Black Forest Labs tests passed in the workflow run.
        labels: dependencies
        delete-branch: true
