name: Build and test

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  # pull_request:
  #   branches: [ develop ]

# Adds permissions to upload test results
permissions:
  pull-requests: write
  contents: write
  statuses: write
  checks: write
  actions: write

jobs:
  build:
    name: Builds and tests libraries & app
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup dotnet
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          10.0.x
          
    # See also DockerFile
    - name: Update apt-get package index
      run: sudo apt-get update -y

    - name: Install Ghostscript (for rendering PDFs)
      run: sudo apt-get install -y ghostscript
    
    - name: Install Time Zone data
      run: sudo apt-get install -y tzdata
    
    #- name: Addresses Database Globalization issues
    #  run: sudo apt-get install -y icu-libs
      
    - name: Install dependencies
      run: dotnet restore InkyCal.sln

    - name: Build
      run: dotnet build InkyCal.sln --configuration Release --no-restore

    - name: Test
      env: # Or as an environment variable
        OpenWeatherAPIKey: ${{ secrets.OpenWeatherAPIKey }}
      run: |
        # xunit.v3 test projects compile to executables (OutputType=Exe) and use the
        # xUnit in-process runner, which does not integrate with `dotnet test` via VSTest.
        # Run each test executable directly, passing -trx to generate TRX report files.
        EXIT_CODE=0
        mkdir -p TestResults
        for testExe in $(find . -path "*/bin/Release/net10.0/*.Tests" -type f -executable); do
          projectName=$(basename "$testExe")
          "$testExe" -trx "TestResults/${projectName}.trx" || EXIT_CODE=$?
        done
        exit $EXIT_CODE

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: testresults
        path: 'TestResults/*.trx'
        retention-days: 1

    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()    # run this step even if previous step failed
      with:
          name: Dotnet testresult # Name of the check run which will be created
          path: 'TestResults/*.trx' # All test results
          reporter: dotnet-trx    # Format of test results
