name: Build and test

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  # pull_request:
  #   branches: [ develop ]

# Adds permissions to upload test results
permissions:
  pull-requests: write
  contents: write
  statuses: write
  checks: write
  actions: write

jobs:
  build:
    name: Builds and tests libraries & app
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          
    # See also DockerFile
    - name: Update apt-get package index
      run: sudo apt-get update -y

    - name: Install Ghostscript (for rendering PDFs)
      run: sudo apt-get install -y ghostscript
    
    - name: Install Time Zone data
      run: sudo apt-get install -y tzdata
    
    #- name: Addresses Database Globalization issues
    #  run: sudo apt-get install -y icu-libs
      
    - name: Install dependencies
      run: dotnet restore InkyCal.sln

    - name: Build
      run: dotnet build InkyCal.sln --configuration Release --no-restore

    - name: Test
      env: # Or as an environment variable
        OpenWeatherAPIKey: ${{ secrets.OpenWeatherAPIKey }}
      run: dotnet test InkyCal.sln --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v7
      if: success() || failure()    # also keep the test results when tests fail
      with:
        name: testresults
        path: '**/*.trx'
        retention-days: 1

    - name: Test Report
      id: test-report
      uses: dorny/test-reporter@v3
      if: success() || failure()    # run this step even if previous step failed
      with:
          name: Dotnet testresult # Name of the check run which will be created
          path: '**/*.trx'        # All test results
          reporter: dotnet-trx    # Format of test results
          list-suites: failed     # Only list failing suites and tests, so failures aren't buried among passing tests
          list-tests: failed
          collapsed: never
          max-annotations: 50     # Annotate each failure (up to the max) on the run and the source line

    - name: Link test report on failure
      if: failure() && steps.test-report.outputs.url_html != ''
      run: |
        echo "::error title=Tests failed::${{ steps.test-report.outputs.failed }} test(s) failed. Report: ${{ steps.test-report.outputs.url_html }}"
        echo "Test report: ${{ steps.test-report.outputs.url_html }}"

