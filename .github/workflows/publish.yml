name: Publish Docker image

on:
  workflow_dispatch:
  workflow_run:
    # Triggers when either workflow completes; publishing waits until both succeeded for the same commit
    workflows: [Build Docker image, Build and test]
    types:
      - completed
    branches: [develop, main, master, feature/redis]

permissions:
  actions: read
  contents: read

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'Build and/or test failed, not deploying'

  check-prerequisites:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Check Docker build and tests succeeded
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
    - name: Check latest runs for this commit
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        ready=true
        for workflow in build-docker-image.yml build-and-test.yml; do
          run=$(gh api "repos/$REPO/actions/workflows/$workflow/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
          echo "$workflow: ${run:-no run}"
          if [ "$run" != "completed success" ]; then
            ready=false
          fi
        done
        if [ "$ready" != true ]; then
          echo "::notice title=Not publishing::Docker build and tests have not both succeeded (yet) for $SHA"
        fi
        echo "ready=$ready" >> "$GITHUB_OUTPUT"

  publish:
    needs: check-prerequisites
    if: ${{ needs.check-prerequisites.outputs.ready == 'true' }}
    name: Publish to docker.io
    runs-on: ubuntu-latest
    steps:
    - name: Docker Login
      # You may pin to the exact commit or the version.
      uses: docker/login-action@v4
      with:
        # Server address of Docker registry. If not set then will default to Docker Hub
        # registry: # optional
        # Username used to log against the Docker registry
        username: ${{ secrets.DOCKER_USERNAME }} # optional
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.DOCKER_PASSWORD }}
        # Log out from the Docker registry at the end of a job
        # logout: # optional, default is true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_NAME }}

    - name: Push Docker image
      # You may pin to the exact commit or the version.
      uses: docker/build-push-action@v7
      with:
        # context: .
        # file: ../Dockerfile
        sbom: true
        push: true
        tags: ${{ github.event.workflow_run.head_branch == 'feature/redis' && 'atreyu/inkycal.server:redis' || 'atreyu/inkycal.server:latest' }}
