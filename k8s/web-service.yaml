apiVersion: v1
kind: Service
metadata:
  labels:
    app: inkycal
  name: web
  namespace: inkycal
spec:
  # type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 5000
  selector:
    app: inkycal
    component: web
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800 # 3 hours
